name: VK power alert

on:
  schedule:
    # каждые 5 минут (время UTC; задержка GitHub 0-20 минут возможна)
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vk-power-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить ВК и отправить в Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python vk_check.py --verbose

      - name: Сохранить состояние
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "vk-alert-bot"
            git config user.email "vk-alert-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push
          else
            echo "state.json не изменился"
          fi
