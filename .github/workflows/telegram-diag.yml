name: Telegram diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bot info and updates
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          token = os.environ["TELEGRAM_TOKEN"]

          def call(method):
              req = urllib.request.Request("https://api.telegram.org/bot%s/%s" % (token, method))
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          me = call("getMe")
          print("GETME:", json.dumps(me, ensure_ascii=False))

          upd = call("getUpdates")
          print("UPDATES_OK:", upd.get("ok"))
          chats = []
          for item in upd.get("result", []):
              msg = item.get("message") or item.get("edited_message") or {}
              chat = msg.get("chat") or {}
              if chat:
                  chats.append({"id": chat.get("id"), "type": chat.get("type"),
                                "name": chat.get("username") or chat.get("first_name")})
          print("CHATS:", json.dumps(chats, ensure_ascii=False))
          PY
