name: Telegram diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bot info and updates
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          token = os.environ["TELEGRAM_TOKEN"]

          def call(method):
              req = urllib.request.Request("https://api.telegram.org/bot%s/%s" % (token, method))
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          me = call("getMe")
          print("GETME:", json.dumps(me, ensure_ascii=False))

          upd = call("getUpdates")
          print("UPDATES_OK:", upd.get("ok"))
          chats = []
          for item in upd.get("result", []):
              msg = item.get("message") or item.get("edited_message") or {}
              chat = msg.get("chat") or {}
              if chat:
                  chats.append({"id": chat.get("id"), "type": chat.get("type"),
                                "name": chat.get("username") or chat.get("first_name")})
          print("CHATS:", json.dumps(chats, ensure_ascii=False))
          PY

      - name: VK reachability
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          url = "https://vk.com/widget_community.php?app=0&width=300px&_ver=1&gid=11784072&mode=4"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept-Language": "ru-RU,ru;q=0.9",
          })
          try:
              with urllib.request.urlopen(req, timeout=40) as r:
                  raw = r.read()
                  status = r.status
          except Exception as e:
              print("VK_ERROR:", repr(e))
              raise SystemExit(1)

          text = raw.decode("cp1251", errors="replace")
          ids = re.findall(r'id="wpt-11784072_(\d+)"', text)
          print("VK_HTTP:", status, "bytes:", len(raw), "posts:", len(ids))
          print("VK_IDS:", ",".join(ids))
          print("VK_CAPTCHA:", "captcha" in text.lower())
          m = re.search(r'class="wall_post_text"[^>]*>(.*?)</div>', text, re.S)
          if m:
              preview = re.sub(r"<[^>]+>", " ", m.group(1))
              preview = re.sub(r"\s+", " ", preview).strip()[:120]
              print("VK_FIRST:", preview)
          PY
