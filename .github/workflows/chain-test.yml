name: chain test

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: dispatch self
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            https://api.github.com/repos/edg1-art/vk-power-alert-kumertau/actions/workflows/chain-test.yml/dispatches)
          echo "DISPATCH_CODE=$code"
